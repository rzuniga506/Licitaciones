version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: licitaciones_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitaciones123}
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitaciones}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitaciones_network

  # FastAPI Backend Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licitaciones_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD:-licitaciones123}@db:5432/${POSTGRES_DB:-licitaciones_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - licitaciones_network

  # Alert Worker (Background Tasks)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licitaciones_worker
    restart: unless-stopped
    command: python run_worker.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD:-licitaciones123}@db:5432/${POSTGRES_DB:-licitaciones_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      WORKER_MODE: "true"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - licitaciones_network

  # Redis (for future caching)
  redis:
    image: redis:7-alpine
    container_name: licitaciones_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - licitaciones_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  licitaciones_network:
    driver: bridge
