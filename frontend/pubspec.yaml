name: licitaciones_app
description: Sistema de Gestión de Licitaciones - Frontend

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP Client
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  animations: ^2.0.11

  # Forms & Validation
  reactive_forms: ^16.1.1

  # Date & Time
  intl: ^0.19.0

  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  universal_html: ^2.2.4

  # PDF Viewer
  flutter_pdfview: ^1.3.2

  # Navigation
  go_router: ^13.0.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Charts & Graphs
  fl_chart: ^0.66.0

  # Utils
  freezed_annotation: ^2.4.1
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.6

flutter:
  uses-material-design: true

